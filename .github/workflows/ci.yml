name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # l'historique de main est nécessaire au contrôle du tag
      # ADR 0003 : un tag de publication ne se pose que sur un commit de main.
      - name: Le tag désigne un commit de main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag $GITHUB_REF_NAME ($GITHUB_SHA) n'est pas sur main : publication refusée (ADR 0003)."
            exit 1
          fi
      # Mission 033 : le nom du tag suit la notation calendaire vAAAA.M.N (mois sans zéro).
      - name: Le tag suit la notation vAAAA.M.N
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/verifier-tag.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
      # ADR 0006 : plus de génération MCU ; le nuancier se redessine à l'identique depuis le CSV du référentiel.
      - name: Rejeu du nuancier
        run: |
          python3 -I terrain-style/generation/nuancier.py
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; echo "::error::fichiers non suivis après le nuancier"; exit 1; }
      # Le jar publié ne contient rien hors de fr/nemeton.
      - name: Le jar de terrain-style ne dépend pas de MCU
        run: |
          set -euo pipefail
          ./gradlew :terrain-style:jar
          jars=$(find terrain-style/build/libs -maxdepth 1 -name 'terrain-style-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          if [ "$(printf '%s' "$jars" | grep -c .)" -ne 1 ]; then echo "::error::attendu exactement un jar de terrain-style, trouvé : '$jars'"; exit 1; fi
          test -f "$jars"
          contenu=$(unzip -Z1 "$jars")
          test -n "$contenu"
          intrus=$(printf '%s\n' "$contenu" | grep -v -e '^META-INF/' -e '^fr/$' -e '^fr/nemeton/' || true)
          if [ -n "$intrus" ]; then echo "::error::classes hors de fr/nemeton dans le jar : $intrus"; exit 1; fi

  # Tests verts sur un tag : release GitHub avec notes générées ; sans effet si elle existe déjà.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release GitHub du tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "La release $GITHUB_REF_NAME existe déjà."
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
