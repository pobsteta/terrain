name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # l'historique de main est nécessaire au contrôle du tag
      # ADR 0003 : un tag de publication ne se pose que sur un commit de main.
      - name: Le tag désigne un commit de main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag $GITHUB_REF_NAME ($GITHUB_SHA) n'est pas sur main : publication refusée (ADR 0003)."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
      # ADR 0001 : la génération des jetons se rejoue à l'octet près.
      - name: Rejeu de la génération des jetons
        run: |
          ./gradlew :terrain-style:generer
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; echo "::error::fichiers non suivis après la génération"; exit 1; }
      - run: ./gradlew :terrain-style:testGeneration
      # ADR 0001 : le jar publié ne contient aucune classe de MCU.
      - name: Le jar de terrain-style ne dépend pas de MCU
        run: |
          set -euo pipefail
          ./gradlew :terrain-style:jar
          jars=$(find terrain-style/build/libs -maxdepth 1 -name 'terrain-style-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          if [ "$(printf '%s' "$jars" | grep -c .)" -ne 1 ]; then echo "::error::attendu exactement un jar de terrain-style, trouvé : '$jars'"; exit 1; fi
          test -f "$jars"
          contenu=$(unzip -Z1 "$jars")
          test -n "$contenu"
          intrus=$(printf '%s\n' "$contenu" | grep -v -e '^META-INF/' -e '^fr/$' -e '^fr/nemeton/' || true)
          if [ -n "$intrus" ]; then echo "::error::classes hors de fr/nemeton dans le jar : $intrus"; exit 1; fi
